
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floating Highlights</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#field{position:relative;width:100%;height:100%;min-height:320px;overflow:hidden}
.bubble{position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:transparent;border:0;padding:0;cursor:grab;user-select:none;touch-action:none;will-change:transform}
.bubble.dragging{z-index:10;cursor:grabbing}
.bubble img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
</style>
</head>
<body>
<div id="field"></div>
<script>
const items=[
{label:"Columbia University",img:"logos/columbia.png",size: 220},
{label:"Reykjavík University",img:"logos/reykjavik.png",size:145},
{label:"Product Club",img:"logos/product-club.png",size:155},
{label:"Biomedical Engineering",img:"logos/biomedical.png",size:155},
{label:"Travel",img:"logos/travel.png",size:190}
];
const field=document.querySelector("#field"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,speed=.33;
let bubbles=[],active=null,lastTime=0;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const render=b=>b.el.style.transform=`translate3d(${b.x-b.r}px,${b.y-b.r}px,0)`;
function setup(){
field.textContent="";bubbles=[];
const w=field.clientWidth,h=field.clientHeight,scale=w<550?.73:w<850?.86:1;
for(const item of items){
const d=item.size*scale,r=d/2,el=document.createElement("div"),img=document.createElement("img");
el.className="bubble";el.style.width=el.style.height=d+"px";el.setAttribute("aria-label",item.label);
img.src=item.img;img.alt=item.label;img.draggable=false;el.append(img);field.append(el);
const theta=Math.random()*Math.PI*2,b={el,r,x:r,y:r,vx:Math.cos(theta)*speed,vy:Math.sin(theta)*speed,hover:false,drag:false,lastX:0,lastY:0};
for(let t=0;t<350;t++){
b.x=clamp(r+Math.random()*Math.max(0,w-2*r),r,Math.max(r,w-r));
b.y=clamp(r+Math.random()*Math.max(0,h-2*r),r,Math.max(r,h-r));
if(bubbles.every(q=>Math.hypot(q.x-b.x,q.y-b.y)>q.r+r+8))break;
}
el.addEventListener("pointerenter",()=>{if(!b.drag)b.hover=true});
el.addEventListener("pointerleave",()=>{if(!b.drag)b.hover=false});
el.addEventListener("pointerdown",e=>{e.preventDefault();active=b;b.drag=true;b.hover=false;b.lastX=e.clientX;b.lastY=e.clientY;el.setPointerCapture(e.pointerId);el.classList.add("dragging")});
el.addEventListener("pointermove",e=>{
if(active!==b)return;
const rect=field.getBoundingClientRect(),dx=e.clientX-b.lastX,dy=e.clientY-b.lastY;
b.vx=clamp(dx,-5,5);b.vy=clamp(dy,-5,5);b.lastX=e.clientX;b.lastY=e.clientY;
b.x=clamp(e.clientX-rect.left,b.r,Math.max(b.r,rect.width-b.r));
b.y=clamp(e.clientY-rect.top,b.r,Math.max(b.r,rect.height-b.r));render(b);
});
const release=()=>{if(active!==b)return;active=null;b.drag=false;b.hover=false;el.classList.remove("dragging")};
el.addEventListener("pointerup",release);el.addEventListener("pointercancel",release);
bubbles.push(b);render(b);
}}
function frame(time){
const dt=Math.min((time-lastTime)/16.67||1,3),w=field.clientWidth,h=field.clientHeight;lastTime=time;
for(const b of bubbles){
if(b.hover||b.drag)continue;
b.vx+=(Math.random()-.5)*.006*dt;b.vy+=(Math.random()-.5)*.006*dt;
const s=Math.hypot(b.vx,b.vy)||1,target=s+(speed-s)*.025*dt;
b.vx=b.vx/s*target;b.vy=b.vy/s*target;b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}
if(b.x>w-b.r){b.x=w-b.r;b.vx=-Math.abs(b.vx)}
if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
if(b.y>h-b.r){b.y=h-b.r;b.vy=-Math.abs(b.vy)}
}
for(let i=0;i<bubbles.length;i++)for(let j=i+1;j<bubbles.length;j++){
const a=bubbles[i],b=bubbles[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=a.r+b.r+50;
if(dist<min){
const nx=dx/dist,ny=dy/dist,push=(min-dist)/2;
if(!a.drag&&!a.hover){a.x-=nx*push;a.y-=ny*push}
if(!b.drag&&!b.hover){b.x+=nx*push;b.y+=ny*push}
const va=a.vx*nx+a.vy*ny,vb=b.vx*nx+b.vy*ny;
if(va>vb){a.vx+=(vb-va)*nx;a.vy+=(vb-va)*ny;b.vx+=(va-vb)*nx;b.vy+=(va-vb)*ny}
}}
for(const b of bubbles){
b.x=clamp(b.x,b.r,Math.max(b.r,w-b.r));
b.y=clamp(b.y,b.r,Math.max(b.r,h-b.r));render(b);
}
requestAnimationFrame(frame);
}
setup();if(!reduced)requestAnimationFrame(frame);
let resizeTimer;
addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(setup,180)});
</script>
</body>
</html>
