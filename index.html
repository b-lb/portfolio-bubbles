<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floating highlights</title><style>
:root{--teal:#668382;--sand:#D4CB96;--ink:#1C232D;--linen:#DAD3BB}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#field{position:relative;width:100%;height:100%;min-height:320px;overflow:hidden}.bubble{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:14px;user-select:none;touch-action:none;cursor:grab;border:1px solid #1c232d10;box-shadow:0 9px 20px #1c232d16,inset 0 6px 12px #ffffff2a;text-align:center;will-change:transform;color:var(--ink)}.bubble.dragging{z-index:9;cursor:grabbing;box-shadow:0 15px 28px #1c232d25}.teal{background:var(--teal);color:white}.sand{background:var(--sand)}.linen{background:var(--linen)}.pale{background:#f6f4ed}.bubble img{object-fit:contain;width:64%;height:46%;pointer-events:none}.bubble.product img{width:75%;height:48%}.bubble.image-only{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important}.bubble.image-only img{width:100%;height:100%;object-fit:contain;display:block}.bubble.image-only.dragging{box-shadow:none!important}.bubble .label{font-size:13px;font-weight:650;line-height:1.13;max-width:100%;pointer-events:none;margin-top:7px}.bubble .sub{font-size:10px;opacity:.85;margin-top:3px;pointer-events:none}.bubble .symbol{font-size:30px;line-height:1;pointer-events:none}.bubble .symbol svg{width:35px;height:35px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round} @media(max-width:600px){.bubble .label{font-size:11px}.bubble .sub{font-size:9px}}
</style></head><body><div id="field" aria-label="Floating portfolio highlights"></div><script>
const items=[
 {label:'Columbia University',img:'logos/columbia.png',size:190,imageOnly:true},
 {label:'Reykjavík University',img:'logos/reykjavik.png',size:156,imageOnly:true},
 {label:'Product Club',img:'logos/product-club.png',size:180,imageOnly:true},
 {label:'Biomedical Engineering',color:'pale',symbol:'brain',size:150},
 {label:'Travel',color:'sand',symbol:'plane',size:112}
];
const symbols={plane:'<svg viewBox="0 0 24 24"><path d="M17 21v-8l-5-3V3a2 2 0 0 1 4 0v7l5 3v3l-5-2v5l2 1v2l-4-1-4 1v-2l2-1v-5l-5 2v-3l5-3V3" transform="translate(-2 0)"/></svg>',brain:'<svg viewBox="0 0 24 24"><path d="M12 18V5a3 3 0 0 0-5.7-1.3A4 4 0 0 0 3.5 10a4 4 0 0 0 1 7 3.5 3.5 0 0 0 7.5 1Zm0 0V5a3 3 0 0 1 5.7-1.3A4 4 0 0 1 20.5 10a4 4 0 0 1-1 7A3.5 3.5 0 0 1 12 18Z"/><path d="M8 8c2 0 2 3 4 3m4-3c-2 0-2 3-4 3M6 14c3-1 4 2 6 2m6-2c-3-1-4 2-6 2"/></svg>'};
const field=document.querySelector('#field'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let bubbles=[],active=null,lastTime=0;const speed=.33;
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function render(b){b.el.style.transform=`translate3d(${b.x-b.r}px,${b.y-b.r}px,0) scale(${b.hover?1.05:1})`}
function setup(){field.textContent='';bubbles=[];let w=field.clientWidth,h=field.clientHeight;const scale=w<550?.73:w<850?.86:1;for(const item of items){let d=item.size*scale,r=d/2;let el=document.createElement('div');el.className='bubble '+(item.color||'')+(item.kind?' '+item.kind:'')+(item.imageOnly?' image-only':'');el.style.width=el.style.height=d+'px';if(item.img){let img=document.createElement('img');img.src=item.img;img.alt=item.label+' logo';el.append(img)}else{let sym=document.createElement('div');sym.className='symbol';sym.innerHTML=symbols[item.symbol]||'';el.append(sym)}if(!item.imageOnly){let label=document.createElement('div');label.className='label';label.textContent=item.label;el.append(label)}if(item.sub&&!item.imageOnly){let sub=document.createElement('div');sub.className='sub';sub.textContent=item.sub;el.append(sub)}field.append(el);let theta=Math.random()*Math.PI*2;let b={el,r,x:r,y:r,vx:Math.cos(theta)*speed,vy:Math.sin(theta)*speed,hover:false,drag:false,lastX:0,lastY:0};for(let tries=0;tries<350;tries++){b.x=clamp(r+Math.random()*Math.max(0,w-2*r),r,Math.max(r,w-r));b.y=clamp(r+Math.random()*Math.max(0,h-2*r),r,Math.max(r,h-r));if(bubbles.every(q=>Math.hypot(q.x-b.x,q.y-b.y)>q.r+r+8))break}el.addEventListener('pointerenter',()=>{if(!b.drag)b.hover=true});el.addEventListener('pointerleave',()=>{if(!b.drag)b.hover=false});el.addEventListener('pointerdown',e=>{e.preventDefault();active=b;b.drag=true;b.hover=false;b.lastX=e.clientX;b.lastY=e.clientY;el.setPointerCapture(e.pointerId);el.classList.add('dragging')});el.addEventListener('pointermove',e=>{if(active!==b)return;let rect=field.getBoundingClientRect(),dx=e.clientX-b.lastX,dy=e.clientY-b.lastY;b.vx=clamp(dx,-5,5);b.vy=clamp(dy,-5,5);b.lastX=e.clientX;b.lastY=e.clientY;b.x=clamp(e.clientX-rect.left,b.r,Math.max(b.r,rect.width-b.r));b.y=clamp(e.clientY-rect.top,b.r,Math.max(b.r,rect.height-b.r));render(b)});function release(){if(active!==b)return;active=null;b.drag=false;b.hover=false;el.classList.remove('dragging')}el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);bubbles.push(b);render(b)}}
function frame(time){let dt=Math.min((time-lastTime)/16.67||1,3);lastTime=time;let w=field.clientWidth,h=field.clientHeight;for(let b of bubbles){if(b.hover||b.drag)continue;b.vx+=(Math.random()-.5)*.006*dt;b.vy+=(Math.random()-.5)*.006*dt;let s=Math.hypot(b.vx,b.vy)||1,target=s+(speed-s)*.025*dt;b.vx=b.vx/s*target;b.vy=b.vy/s*target;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>w-b.r){b.x=w-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.y>h-b.r){b.y=h-b.r;b.vy=-Math.abs(b.vy)}}for(let i=0;i<bubbles.length;i++)for(let j=i+1;j<bubbles.length;j++){let a=bubbles[i],b=bubbles[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=a.r+b.r+4;if(dist<min){let nx=dx/dist,ny=dy/dist,push=(min-dist)/2;if(!a.drag&&!a.hover){a.x-=nx*push;a.y-=ny*push}if(!b.drag&&!b.hover){b.x+=nx*push;b.y+=ny*push}let va=a.vx*nx+a.vy*ny,vb=b.vx*nx+b.vy*ny;if(va>vb){a.vx+=(vb-va)*nx;a.vy+=(vb-va)*ny;b.vx+=(va-vb)*nx;b.vy+=(va-vb)*ny}}}bubbles.forEach(render);requestAnimationFrame(frame)}setup();if(!reduced)requestAnimationFrame(frame);let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(setup,180)});
</script></body></html>
